<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /home/oakfield/oakfield-sms/current/public

    <Directory /home/oakfield/oakfield-sms/current/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
