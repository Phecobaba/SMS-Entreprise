/* Oakfield student design — canonical shared CSS.
   Token names match resources/css/app.css. Class names reuse the app's `oak-` vocabulary
   where one already exists; new classes are marked NEW. Everything here is inlined into each
   screen file so every file opens standalone. */

/* ---------- Tokens ---------- */
:root {
  --color-bg: #FBF8EF;
  --color-surface: #F1EAD8;
  --color-text: #1F3638;
  --color-text-muted: #5B6B6A;
  --color-brand-teal: #2E4F56;
  --color-brand-cream: #F5E58A;
  --color-accent-ochre: #C77B3F;
  --color-success: #3F7D63;       --color-success-bg: #EAF3DE;
  --color-warning: #633806;       --color-warning-bg: #FAEEDA;
  --color-danger: #791F1F;        --color-danger-bg: #FCEBEB;
  --color-border: #DDD3BA;
  --color-border-light: #EFE9DA;
  /* NEW — contrast-safe companions (see DESIGN_AMENDMENTS.md) */
  --color-success-ink: #27500A;      /* pill text on success-bg: 8.2:1 (was 4.25:1) */
  --color-success-num: #2E6B50;      /* big green numbers on surface: 5.25:1 (was 4.05:1) */
  --color-ochre-ink: #9A5A22;        /* ochre TEXT on bg/surface: 5.1:1 (was 3.12:1). Borders/dots keep #C77B3F */
  --color-tab-idle: #6F6A5E;         /* inactive mobile tab: 5.4:1 (was 2.99:1) */
  --color-sidebar-text: #D9E6E3;
  --color-sidebar-rule: #3E6168;
  --color-band-muted: #B9CBC8;
  --font-sans: -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-serif: Georgia, 'Times New Roman', serif;
  --tap: 44px;
}

/* ---------- Reset (the app gets this from Tailwind preflight) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: 16px; line-height: 1.45; }
h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
table { border-collapse: collapse; width: 100%; }
[hidden] { display: none !important; }
svg.oak-i { width: 1.25em; height: 1.25em; flex: 0 0 auto; vertical-align: middle; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
h1, h2, .oak-school-name { font-family: var(--font-serif); font-weight: 600; }
:is(a, button, input, select, textarea, summary, [tabindex]):focus-visible { outline: 3px solid var(--color-accent-ochre); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; } }

/* ---------- App shell (matches app.css 150px sidebar / mobile band + 5 tabs) ---------- */
.oak-app-shell { min-height: 100vh; display: grid; grid-template-columns: 150px minmax(0,1fr); }
.oak-sidebar { background: var(--color-brand-teal); display: flex; flex-direction: column; padding: 18px 12px 16px; position: sticky; top: 0; height: 100vh; }
.oak-brand { color: inherit; display: flex; align-items: center; gap: .6rem; min-width: 0; text-decoration: none; }
.oak-sidebar-brand { min-height: 60px; margin: 0 4px 28px; }
/* Design files paint the emblem via background so the data URI is stored once; in the build use the app's <img class="oak-logo-mark"> inside .oak-logo-crop exactly as _shell-start does. */
.oak-logo-crop { display: block; width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; overflow: hidden; background: var(--color-brand-teal) var(--emblem, none) center / cover no-repeat; }
.oak-sidebar .oak-school-name { font-size: 1rem; color: var(--color-brand-cream); }
.oak-sidebar-links { display: grid; gap: 3px; align-content: start; overflow-y: auto; }
.oak-sidebar-links a { display: flex; align-items: center; gap: 11px; min-height: 40px; padding: 7px 9px; font-size: .88rem; border-radius: 7px; color: var(--color-sidebar-text); text-decoration: none; }
.oak-sidebar-links a:hover { background: rgba(245,229,138,.14); }
.oak-sidebar-links a.oak-active, .oak-sidebar-links a[aria-current="page"] { background: var(--color-brand-cream); color: var(--color-brand-teal); }
.oak-sidebar-foot { margin-top: auto; border-top: 1px solid var(--color-sidebar-rule); padding-top: 8px; display: grid; gap: 3px; }
.oak-sidebar-foot a, .oak-sidebar-foot button { display: flex; align-items: center; gap: 11px; min-height: 40px; padding: 7px 9px; border-radius: 7px; color: var(--color-sidebar-text); background: none; border: 0; font-size: .88rem; text-decoration: none; width: 100%; text-align: left; }
.oak-sidebar-foot a:hover, .oak-sidebar-foot button:hover { background: rgba(245,229,138,.14); }
.oak-sidebar-foot a.oak-active { background: var(--color-brand-cream); color: var(--color-brand-teal); }

.oak-content { min-width: 0; background: var(--color-bg); }
.oak-dashboard { padding: 24px 28px 48px; }
.oak-dashboard-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.oak-dashboard-heading h1 { font-size: clamp(1.6rem, 2.4vw, 2.1rem); line-height: 1.18; font-weight: 400; }
.oak-dashboard-heading p { margin-top: 4px; color: var(--color-text-muted); font-size: 1rem; }
.oak-heading-tools { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.oak-role-pill { border-radius: 999px; padding: 6px 15px; background: var(--color-brand-cream); color: var(--color-brand-teal); font-size: .8rem; white-space: nowrap; }
.oak-bell { position: relative; display: grid; place-items: center; width: var(--tap); height: var(--tap); border-radius: 50%; color: var(--color-brand-teal); text-decoration: none; }
.oak-bell:hover { background: var(--color-surface); }
.oak-bell .oak-i { width: 22px; height: 22px; }
.oak-bell b { position: absolute; top: 5px; right: 3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--color-accent-ochre); color: #fff; font-size: .68rem; line-height: 18px; text-align: center; font-weight: 600; }

/* Mobile band + tab bar */
.oak-header { display: none; background: var(--color-brand-teal); color: var(--color-brand-cream); padding: 14px 18px 16px; position: relative; }
.oak-header .oak-school-name { font-size: 1.1rem; }
.oak-header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.oak-header .oak-brand { min-height: var(--tap); }
.oak-header .oak-logo-crop { width: 34px; height: 34px; flex-basis: 34px; }
.oak-header .oak-bell { color: var(--color-sidebar-text); }
.oak-header .oak-bell:hover { background: rgba(255,255,255,.1); }
.oak-header-intro { display: flex; flex-direction: column; margin-top: 8px; color: #fff; }
.oak-header-intro strong { font: 600 1.35rem var(--font-serif); }
.oak-header-intro span { color: var(--color-band-muted); font-size: .88rem; }
.oak-mobile-tabs { display: none; }

/* ---------- Buttons & actions ---------- */
.oak-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 9px 18px; border-radius: 8px; font-size: .95rem; text-decoration: none; border: 1.5px solid transparent; white-space: nowrap; }
.oak-btn-primary { background: var(--color-brand-teal); color: var(--color-brand-cream); border-color: var(--color-brand-teal); }
.oak-btn-primary:hover { background: #264248; }
.oak-btn-secondary { background: var(--color-bg); color: var(--color-ochre-ink); border-color: var(--color-accent-ochre); }
.oak-btn-secondary:hover { background: var(--color-surface); }
.oak-btn-quiet { background: transparent; color: var(--color-brand-teal); border-color: var(--color-border); }
.oak-btn-block { width: 100%; }
.oak-btn[disabled], .oak-btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.oak-link { display: inline-flex; align-items: center; color: var(--color-brand-teal); text-decoration: underline; text-underline-offset: 3px; font-size: .9rem; background: none; border: 0; padding: 0; }
@media (max-width: 767px), (pointer: coarse) { .oak-link { min-height: var(--tap); padding: 0 6px; margin: 0 -6px; } }

/* ---------- Pills ---------- */
.oak-status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.oak-status-success { background: var(--color-success-bg); color: var(--color-success-ink); }
.oak-status-warning { background: var(--color-warning-bg); color: var(--color-warning); }
.oak-status-danger  { background: var(--color-danger-bg);  color: var(--color-danger); }
.oak-status-neutral { background: var(--color-surface);    color: var(--color-text-muted); }   /* NEW: Scheduled, Closed */
.oak-status-new     { background: var(--color-brand-cream); color: var(--color-text); }          /* NEW: "2 new" counters */

/* ---------- Metric cards ---------- */
.oak-metric-grid { display: grid; gap: 12px; }
.oak-metric-grid-three { grid-template-columns: repeat(3,minmax(0,1fr)); }
.oak-metric { min-width: 0; padding: 15px 17px; background: var(--color-surface); border-radius: 11px; display: flex; flex-direction: column; gap: 4px; }
.oak-metric > span { color: var(--color-text-muted); font-size: .88rem; }
.oak-metric > strong { font-size: clamp(1.45rem,2.5vw,2rem); font-weight: 400; line-height: 1.2; }
.oak-metric small { color: var(--color-text-muted); font-size: .78rem; }
.oak-metric-success { color: var(--color-success-num); }
.oak-metric-accent { color: var(--color-ochre-ink); }
.oak-metric > strong.oak-metric-locked { display: flex; align-items: center; gap: 8px; font-size: 1.2rem; color: var(--color-text-muted); }
.oak-metric-locked .oak-i { width: 20px; height: 20px; }

/* ---------- Sections, tables, rows ---------- */
.oak-section { margin-top: 26px; }
.oak-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.oak-section-head h2 { font: 400 1.05rem var(--font-sans); }
.oak-table-scroll { overflow-x: auto; }
.oak-table th { color: var(--color-text-muted); font-weight: 400; text-align: left; border-bottom: 1px solid var(--color-border); padding: 8px 6px; font-size: .88rem; }
.oak-table td { border-bottom: 1px solid var(--color-border-light); padding: 11px 6px; font-size: .95rem; }
.oak-table tr:last-child td { border-bottom: 0; }
.oak-table td.oak-num, .oak-table th.oak-num { text-align: right; }
.oak-list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-border-light); font-size: .95rem; min-height: 48px; }
.oak-list-row:last-child { border-bottom: 0; }
.oak-list-row .oak-muted { color: var(--color-text-muted); font-size: .85rem; }
.oak-list-row > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.oak-two-col { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 28px; }
.oak-empty { display: grid; justify-items: start; gap: 6px; padding: 14px 0; color: var(--color-text-muted); font-size: .95rem; }
.oak-empty strong { color: var(--color-text); font-weight: 600; }
.oak-empty .oak-i { width: 28px; height: 28px; color: var(--color-brand-teal); }

/* ---------- Banners (NEW) ---------- */
.oak-banner { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 16px; border-radius: 10px; background: #fff; border: 1.5px solid var(--color-brand-teal); }
.oak-banner-main { display: flex; align-items: center; gap: 13px; min-width: 0; }
.oak-banner-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 9px; background: var(--color-brand-teal); color: var(--color-brand-cream); flex: 0 0 42px; }
.oak-banner h2, .oak-banner h3 { font: 600 1rem var(--font-sans); }
.oak-banner p { color: var(--color-text-muted); font-size: .88rem; margin-top: 2px; }
.oak-notice { display: flex; gap: 11px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; font-size: .92rem; }
.oak-notice .oak-i { margin-top: 1px; }
.oak-notice-warning { background: var(--color-warning-bg); color: var(--color-warning); }
.oak-notice-danger { background: var(--color-danger-bg); color: var(--color-danger); }
.oak-notice-info { background: var(--color-surface); color: var(--color-text); }
.oak-notice-success { background: var(--color-success-bg); color: var(--color-success-ink); }
.oak-locked { display: grid; gap: 10px; justify-items: start; padding: 18px; border-radius: 11px; background: var(--color-surface); }
.oak-locked > .oak-i { width: 26px; height: 26px; color: var(--color-brand-teal); }
.oak-locked h3 { font: 600 1.05rem var(--font-serif); }
.oak-locked p { color: var(--color-text-muted); font-size: .92rem; max-width: 52ch; }

/* ---------- Notification ticker (NEW) ---------- */
.oak-ticker { display: flex; align-items: stretch; background: var(--color-surface); border-bottom: 1px solid var(--color-border); min-height: 45px; font-size: .9rem; }
.oak-ticker-label { display: flex; align-items: center; gap: 7px; padding: 0 14px; background: var(--color-brand-teal); color: var(--color-brand-cream); font-size: .82rem; white-space: nowrap; }
.oak-ticker-label .oak-i { width: 17px; height: 17px; }
.oak-ticker-view { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.oak-ticker-track { display: inline-flex; align-items: center; gap: 48px; padding-right: 48px; height: 100%; white-space: nowrap; animation: oak-scroll var(--ticker-dur, 38s) linear infinite; }
.oak-ticker:hover .oak-ticker-track, .oak-ticker:focus-within .oak-ticker-track, .oak-ticker[data-paused] .oak-ticker-track { animation-play-state: paused; }
.oak-ticker-track a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 10px 2px; }
.oak-ticker-track a:hover span:first-child { text-decoration: underline; }
.oak-ticker-track b { font-weight: 600; }
.oak-ticker-track i { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent-ochre); display: inline-block; }
.oak-ticker-static { display: none; }
.oak-ticker-pause { display: grid; place-items: center; width: var(--tap); background: none; border: 0; border-left: 1px solid var(--color-border); color: var(--color-brand-teal); }
@keyframes oak-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) {
  .oak-ticker-track { animation: none; gap: 22px; }
  .oak-ticker-view { overflow-x: auto; }
  .oak-ticker-track [aria-hidden="true"] { display: none; }
  .oak-ticker-pause { display: none; }
}

/* ---------- Bottom sheet / modal (NEW) ---------- */
.oak-scrim { position: fixed; inset: 0; background: rgba(31,54,56,.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
.oak-scrim[data-open] { display: flex; }
.oak-sheet { width: 100%; max-width: 440px; max-height: 92vh; overflow-y: auto; background: #fff; border-radius: 14px; border: 1px solid var(--color-border); padding: 22px; }
.oak-sheet h2 { font-size: 1.3rem; font-weight: 600; }
.oak-sheet > p.oak-sheet-sub { margin: 4px 0 16px; color: var(--color-text-muted); font-size: .92rem; }
.oak-sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.oak-sheet-actions .oak-btn { flex: 1; }
.oak-rules { display: grid; gap: 10px; margin: 6px 0 0; }
.oak-rules li { display: flex; gap: 10px; align-items: flex-start; font-size: .93rem; }
.oak-rules .oak-i { color: var(--color-brand-teal); margin-top: 2px; }

/* ---------- Toast (NEW) ---------- */
.oak-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--color-text); color: #fff; padding: 11px 16px; border-radius: 9px; font-size: .92rem; z-index: 80; display: none; max-width: 90vw; }
.oak-toast[data-open] { display: block; }

/* ---------- Form fields (NEW — login, profile) ---------- */
.oak-field { display: grid; gap: 6px; }
.oak-field label { font-size: .92rem; font-weight: 600; }
.oak-field input { min-height: 48px; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: 8px; background: #fff; font: inherit; color: var(--color-text); width: 100%; }
.oak-field input[aria-invalid="true"] { border-color: var(--color-danger); background: var(--color-danger-bg); }
.oak-field .oak-hint { font-size: .85rem; color: var(--color-text-muted); }
.oak-field .oak-error { font-size: .88rem; color: var(--color-danger); display: flex; gap: 6px; align-items: center; }

/* ---------- Pagination (NEW — mirrors Laravel simple links) ---------- */
.oak-pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; font-size: .9rem; color: var(--color-text-muted); }

/* ---------- Design-only chrome (NOT part of the build) ---------- */
.design-only { position: fixed; z-index: 50; left: 12px; bottom: 12px; background: #1F3638; color: #fff; border-radius: 10px; padding: 8px 10px; font: 12px/1.3 var(--font-sans); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; max-width: calc(100vw - 24px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.design-only b { font-weight: 600; margin-right: 4px; }
.design-only button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 6px; padding: 5px 9px; font-size: 12px; min-height: 28px; }
.design-only button[aria-pressed="true"] { background: var(--color-brand-cream); color: var(--color-text); }

/* ---------- Mobile (≤767px) ---------- */
@media (max-width: 767px) {
  .oak-app-shell { display: block; padding-bottom: 76px; }
  .oak-sidebar { display: none; }
  .oak-header { display: block; }
  .oak-dashboard-heading { display: none; }
  .oak-dashboard { padding: 14px 14px 28px; }
  .oak-metric-grid { gap: 8px; }
  .oak-metric { padding: 11px 10px; border-radius: 10px; }
  .oak-metric > span { font-size: .78rem; }
  .oak-metric > strong { font-size: 1.4rem; }
  .oak-two-col { grid-template-columns: 1fr; gap: 0; }
  .oak-banner { flex-direction: column; align-items: stretch; }
  .oak-banner .oak-btn { width: 100%; }
  .oak-section { margin-top: 22px; }
  .oak-mobile-tabs { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; min-height: 68px; background: #fff; border-top: 1px solid var(--color-border); padding-bottom: env(safe-area-inset-bottom); }
  .oak-mobile-tabs > a, .oak-mobile-tabs > button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 7px 2px; color: var(--color-tab-idle); text-decoration: none; font-size: .72rem; line-height: 1.1; background: none; border: 0; }
  .oak-mobile-tabs .oak-i { width: 23px; height: 23px; }
  .oak-mobile-tabs [aria-current="page"], .oak-mobile-tabs .oak-active { color: var(--color-brand-teal); font-weight: 600; }
  .oak-mobile-tabs [aria-current="page"] .oak-i { stroke-width: 2.4; }
  .oak-scrim { align-items: flex-end; padding: 0; }
  .oak-sheet { max-width: none; border-radius: 16px 16px 0 0; padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
  .design-only { bottom: 80px; }
  /* tables that must stay tables become two-line rows */
  .oak-stack thead { display: none; }
  .oak-stack tr { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--color-border-light); }
  .oak-stack tr:last-child { border-bottom: 0; }
  .oak-stack td { border: 0; padding: 0; }
  .oak-stack td:first-child { grid-column: 1; grid-row: 1; }
  .oak-stack td:last-child { grid-column: 2; grid-row: 1; text-align: right; }
  .oak-stack td:nth-child(2):not(:last-child) { grid-column: 1 / -1; grid-row: 2; color: var(--color-text-muted); font-size: .85rem; }
  .oak-notice-action { flex-wrap: wrap; }
  .oak-notice-action > form, .oak-notice-action > form .oak-btn { width: 100%; }
  .oak-metric > strong.oak-metric-locked { font-size: 1.05rem; }
  .oak-ticker-label span { display: none; }
  .oak-ticker-track { display: none; }
  .oak-ticker-static { display: flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: .9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
  .oak-ticker-static[data-fade] { animation: oak-fade .45s ease; }
  @keyframes oak-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
@media (min-width: 768px) and (max-width: 1000px) { .oak-dashboard { padding: 20px 20px 40px; } }

/* ---------- Exam list rows (NEW) ---------- */
.oak-exam-list { display: grid; }
.oak-exam-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--color-border-light); }
.oak-exam-row:last-child { border-bottom: 0; }
.oak-exam-row h3 { font: 600 1rem var(--font-sans); }
.oak-exam-meta { color: var(--color-text-muted); font-size: .88rem; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.oak-exam-meta span { display: inline-flex; align-items: center; gap: 5px; }
.oak-exam-meta .oak-i { width: 15px; height: 15px; }
.oak-exam-row[data-open-now] { background: #fff; border: 1.5px solid var(--color-brand-teal); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
.oak-exam-row > .oak-status-pill { justify-self: start; }
.oak-exam-score { font-size: .95rem; white-space: nowrap; }
@media (max-width: 767px) {
  .oak-exam-row { grid-template-columns: 1fr; }
  .oak-exam-row > .oak-btn { width: 100%; }
}

/* Student batch 2 — ONLY the classes that are new in this batch. Load after oak-student.css.
   Same tokens, same 767px breakpoint. */

/* ---------- Filter chips (Assignments, E-Notes, Exam result) ---------- */
.oak-chip-nav { display: flex; flex-wrap: wrap; gap: 8px; }
.oak-chip { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 16px; border-radius: 999px; border: 1px solid var(--color-border); background: #fff; color: var(--color-text); font-size: .92rem; text-decoration: none; }
.oak-chip:hover { background: var(--color-surface); }
.oak-chip[aria-current="true"], .oak-chip[aria-pressed="true"] { background: var(--color-brand-teal); border-color: var(--color-brand-teal); color: var(--color-brand-cream); font-weight: 600; }
.oak-chip small { font-size: .78rem; opacity: .85; }
.oak-subpage-note { color: var(--color-text-muted); font-size: .92rem; max-width: 62ch; }

/* ---------- Exam result ---------- */
.rs-hero { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 28px; align-items: center; background: var(--color-surface); border-radius: 12px; padding: 20px 24px; }
.rs-score { font: 400 clamp(2.4rem,5vw,3.2rem)/1 var(--font-serif); }
.rs-score small { font-size: .45em; color: var(--color-text-muted); }
.rs-meter { height: 10px; border-radius: 999px; background: #fff; overflow: hidden; margin-top: 10px; }
.rs-meter > i { display: block; height: 100%; background: var(--color-success); }
.rs-hero p { color: var(--color-text-muted); font-size: .92rem; }
.rs-q { padding: 16px 0; border-bottom: 1px solid var(--color-border-light); display: grid; gap: 8px; }
.rs-q:last-child { border-bottom: 0; }
.rs-q h3 { font: 400 1.05rem/1.5 var(--font-serif); display: flex; gap: 10px; }
.rs-q h3 > span:first-child { color: var(--color-text-muted); font-family: var(--font-sans); font-size: .9rem; flex: 0 0 2ch; padding-top: 2px; }
.rs-ans { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding-left: calc(2ch + 10px); font-size: .93rem; }
.rs-ans .oak-muted { color: var(--color-text-muted); }
.rs-explain { margin-left: calc(2ch + 10px); padding: 9px 12px; border-left: 3px solid var(--color-brand-teal); background: var(--color-surface); border-radius: 0 8px 8px 0; font-size: .92rem; }
.rs-waiting { display: grid; justify-items: start; gap: 10px; padding: 26px; background: var(--color-surface); border-radius: 12px; }
.rs-waiting > .oak-i { width: 30px; height: 30px; color: var(--color-brand-teal); }
.rs-waiting h2 { font: 600 1.2rem var(--font-serif); }
.rs-waiting p { color: var(--color-text-muted); max-width: 54ch; }

/* ---------- Report card ---------- */
.rc-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; padding: 18px 20px; background: var(--color-surface); border-radius: 12px; }
.rc-head h2 { font: 600 1.35rem var(--font-serif); }
.rc-head p { color: var(--color-text-muted); font-size: .92rem; margin-top: 2px; }
.rc-facts { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin-top: 12px; }
.rc-fact { padding: 12px 14px; border: 1px solid var(--color-border); border-radius: 10px; background: #fff; }
.rc-fact span { display: block; color: var(--color-text-muted); font-size: .82rem; }
.rc-fact strong { font: 400 1.5rem var(--font-serif); }
.rc-table th.rc-c, .rc-table td.rc-c { text-align: center; }
.rc-comp { color: var(--color-text-muted); font-size: .85rem; }
.rc-grade { display: inline-grid; place-items: center; min-width: 34px; height: 30px; border-radius: 8px; background: var(--color-surface); font-weight: 700; }
.rc-comments { display: grid; gap: 10px; }
.rc-comment { padding: 14px 16px; border: 1px solid var(--color-border); border-radius: 10px; background: #fff; }
.rc-comment h3 { font: 600 .92rem var(--font-sans); color: var(--color-text-muted); margin-bottom: 4px; }
.rc-comment p { font-family: var(--font-serif); font-size: 1.02rem; line-height: 1.55; }
.rc-foot { color: var(--color-text-muted); font-size: .85rem; margin-top: 14px; }

/* ---------- Attendance ---------- */
.at-grid { display: grid; grid-template-columns: repeat(10,minmax(0,1fr)); gap: 6px; }
.at-cell { display: grid; place-items: center; gap: 0; height: 52px; border-radius: 8px; font-size: .72rem; line-height: 1.15; padding-top: 3px; }
.at-cell b { font-size: 1rem; font-weight: 700; }
.at-p { background: var(--color-success-bg); color: var(--color-success-ink); }
.at-l { background: var(--color-warning-bg); color: var(--color-warning); }
.at-a { background: var(--color-danger-bg); color: var(--color-danger); }
.at-e { background: var(--color-surface); color: var(--color-text-muted); }
.at-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .85rem; color: var(--color-text-muted); }
.at-legend span { display: inline-flex; align-items: center; gap: 6px; }
.at-legend i { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; font-style: normal; font-weight: 700; font-size: .68rem; }

/* ---------- Assignments, notes, notifications, fees: shared row anatomy ---------- */
.oak-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--color-border-light); min-height: 64px; }
.oak-row:last-child { border-bottom: 0; }
.oak-row h3 { font: 600 1rem var(--font-sans); }
.oak-row p { color: var(--color-text-muted); font-size: .88rem; margin-top: 2px; }
.oak-row-end { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
details.oak-row { display: block; padding: 0; }
details.oak-row > summary { list-style: none; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 0; min-height: 64px; cursor: pointer; }
details.oak-row > summary::-webkit-details-marker { display: none; }
details.oak-row > summary .oak-i.chev { transition: transform .15s; }
details.oak-row[open] > summary .oak-i.chev { transform: rotate(90deg); }
.oak-row-body { padding: 0 0 16px; color: var(--color-text); font-size: .95rem; max-width: 64ch; }
.oak-due-soon { color: var(--color-warning); font-weight: 600; }
.oak-due-over { color: var(--color-danger); font-weight: 600; }

/* notifications */
.nt-row { position: relative; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 16px; align-items: start; padding: 16px 16px 16px 20px; border-bottom: 1px solid var(--color-border-light); }
.nt-row:last-child { border-bottom: 0; }
.nt-row[data-unread] { background: #fff; }
.nt-row[data-unread]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--color-accent-ochre); }
.nt-row h3 { font: 600 1rem var(--font-sans); display: flex; align-items: center; gap: 8px; }
.nt-row:not([data-unread]) h3 { font-weight: 400; color: var(--color-text-muted); }
.nt-row p { margin-top: 3px; font-size: .92rem; color: var(--color-text-muted); }
.nt-row time { display: block; margin-top: 6px; font-size: .8rem; color: var(--color-text-muted); }
.nt-list { border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-surface); overflow: hidden; }

/* fees */
.fe-summary { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 18px 20px; border-radius: 12px; background: var(--color-surface); }
.fe-summary strong { font: 400 2rem var(--font-serif); display: block; }
.fe-summary span { color: var(--color-text-muted); font-size: .9rem; }

/* profile */
.pf-list { display: grid; border: 1px solid var(--color-border); border-radius: 12px; background: #fff; overflow: hidden; }
.pf-list > div { display: grid; grid-template-columns: 180px minmax(0,1fr); gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--color-border-light); }
.pf-list > div:last-child { border-bottom: 0; }
.pf-list dt { color: var(--color-text-muted); font-size: .9rem; }
.pf-list dd { margin: 0; word-break: break-word; }
.pf-avatar { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--color-brand-teal); color: var(--color-brand-cream); font: 600 1.4rem var(--font-serif); flex: 0 0 56px; }

/* login (guest layout: no shell) */
.lg { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); background: var(--color-bg); }
.lg-brand { background: var(--color-brand-teal); display: grid; place-items: center; padding: 32px; }
.lg-brand img { width: min(360px, 70%); height: auto; display: block; }
.lg-main { display: grid; place-items: center; padding: 32px 24px; }
.lg-card { width: 100%; max-width: 380px; display: grid; gap: 18px; }
.lg-card h1 { font: 400 2rem var(--font-serif); }
.lg-card .oak-sub { color: var(--color-text-muted); margin-top: -10px; }
.lg-pw { position: relative; }
.lg-pw input { padding-right: 52px; }
.lg-pw button { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--color-text-muted); border-radius: 8px; }
.lg-check { display: flex; align-items: center; gap: 10px; min-height: var(--tap); font-size: .95rem; }
.lg-check input { width: 22px; height: 22px; accent-color: var(--color-brand-teal); }
.lg-top { display: none; }

@media (max-width: 767px) {
  .rs-hero { grid-template-columns: 1fr; padding: 16px; }
  .rs-ans, .rs-explain { padding-left: 0; margin-left: 0; }
  .rs-ans { margin-left: 0; }
  .rc-head { grid-template-columns: 1fr; }
  .rc-head .oak-btn { width: 100%; }
  .rc-facts { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
  .rc-fact { padding: 10px; }
  .rc-fact strong { font-size: 1.2rem; }
  .rc-table thead { display: none; }
  .rc-table tr { display: grid; grid-template-columns: auto auto minmax(0,1fr) auto; gap: 4px 8px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--color-border-light); }
  .rc-table tr:last-child { border-bottom: 0; }
  .rc-table td { border: 0; padding: 0; text-align: left !important; }
  .rc-table td.rc-subject { grid-column: 1 / 4; grid-row: 1; font-weight: 600; }
  .rc-table td.rc-gradecell { grid-column: 4; grid-row: 1; text-align: right !important; }
  .rc-table td.rc-total { grid-column: 1; grid-row: 2; font-size: .92rem; }
  .rc-table td.rc-total::before { content: "Total "; color: var(--color-text-muted); }
  .rc-table td.rc-pct { grid-column: 2; grid-row: 2; font-size: .92rem; color: var(--color-text-muted); }
  .rc-table td.rc-pct::before { content: "· "; }
  .rc-table td.rc-remark { grid-column: 3 / 5; grid-row: 2; text-align: right !important; color: var(--color-text-muted); font-size: .88rem; }
  .rc-table td.rc-compcell { grid-column: 1 / -1; grid-row: 3; }
  .at-grid { grid-template-columns: repeat(6,minmax(0,1fr)); }
  .oak-row { grid-template-columns: 1fr; }
  .oak-row-end { justify-content: flex-start; }
  .oak-row-end .oak-btn { width: 100%; }
  .fe-summary { grid-template-columns: 1fr; }
  .fe-summary .oak-btn { width: 100%; }
  .nt-row { grid-template-columns: 1fr; }
  .nt-row .oak-btn { width: 100%; }
  .pf-list > div { grid-template-columns: 1fr; gap: 2px; }
  .lg { grid-template-columns: 1fr; }
  .lg-brand { display: none; }
  .lg-top { display: flex; align-items: center; gap: 12px; background: var(--color-brand-teal); color: var(--color-brand-cream); padding: 18px; }
  .lg-top .oak-logo-crop { width: 44px; height: 44px; flex-basis: 44px; }
  .lg-top .oak-school-name { font-size: 1.15rem; }
  .lg-main { place-items: start center; padding: 24px 18px 40px; }
  .lg-card h1 { font-size: 1.7rem; }
}

</style>
</head>

    tb.addEventListener('click',function(e){var b=e.target.closest('button[data-state]'); if(b) set(b.dataset.state);});
    set(tb.querySelector('button[data-state]').dataset.state);
  }
})();
