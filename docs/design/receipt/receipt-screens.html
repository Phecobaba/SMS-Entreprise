<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt on screen (mock pieces)</title>
<style>body{margin:0;padding:24px 16px;background:#FBF6EA;font:16px/1.5 system-ui,Arial,sans-serif;color:#1B2524}h1{font:bold 1.3rem Georgia,serif;color:#0A3836}h2{font:bold 1rem Georgia,serif;color:#0A3836;margin:28px 0 8px}
.wrap{max-width:720px;margin:0 auto}.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 8px rgba(14,74,71,.12)}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;background:#0E4A47;color:#FBF6EA;font:700 1rem system-ui,Arial,sans-serif;text-decoration:none;border:2px solid #0E4A47;transition:background .2s,transform .2s}
.btn:hover{background:#0A3836;transform:translateY(-2px)}.btn:focus-visible{outline:3px solid #1C2B4D;outline-offset:3px}.btn:active{transform:scale(.97)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.85rem;color:#4A5755;padding:8px;border-bottom:2px solid #0E4A47}td{padding:10px 8px;border-bottom:1px solid #E6DFC9}.r{text-align:right}
.btn.sm{min-height:44px;padding:0 16px;font-size:.95rem}.paidtag{font-weight:700;color:#0B5A33}
.scroll{overflow-x:auto}@media(prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}</style></head><body><div class="wrap">

<tr><td>RCT-2026-000192</td><td>5 Nov 2026</td><td class="r">&#8358;100,000.00</td><td class="r"><a class="btn sm" href="receipt-tuition-part.html">Download receipt (PDF)</a></td></tr></table></div></div></body></html>
